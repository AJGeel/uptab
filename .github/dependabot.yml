version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    # Like minimumReleaseAge in bunfig.toml: a fresh release waits 14 days.
    cooldown:
      default-days: 14
    # TypeScript 7 breaks typescript-eslint's tooling. Revisit around 2027-05-04.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      github-actions:
        patterns: ["*"]
